<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="description" content="Momentum - Suivi personnel complet, 100% local, zero API">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Momentum">
<title>Momentum</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body data-theme="light">

<div id="splash" class="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 100 100" width="80" height="80" aria-hidden="true">
      <defs>
        <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b5cf6"/>
          <stop offset="1" stop-color="#06b6d4"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="none" stroke="url(#splashGrad)" stroke-width="4"/>
      <path d="M28 60 L42 42 L52 54 L72 32" fill="none" stroke="url(#splashGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="splash-title">Momentum</div>
  <div class="splash-sub">Chargement...</div>
</div>

<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <svg viewBox="0 0 100 100" width="28" height="28" aria-hidden="true">
          <defs>
            <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b5cf6"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="42" fill="none" stroke="url(#brandGrad)" stroke-width="6"/>
          <path d="M28 60 L42 42 L52 54 L72 32" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">Momentum</span>
      </div>
      <button id="sidebar-close" class="icon-btn mobile-only" aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>

    <nav class="nav">
      <a class="nav-item active" data-route="dashboard">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><rect x="3" y="3" width="7" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="12" width="7" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="16" width="7" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" data-route="habits">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><path d="M5 12l4 4L19 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Habitudes</span>
      </a>
      <a class="nav-item" data-route="goals">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        <span>Objectifs</span>
      </a>
      <a class="nav-item" data-route="journal">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><path d="M6 3h10a2 2 0 012 2v16l-7-4-7 4V5a2 2 0 012-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Journal</span>
      </a>
      <a class="nav-item" data-route="finance">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><path d="M4 7h16v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 7l2-3h12l2 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Finances</span>
      </a>
      <a class="nav-item" data-route="fitness">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Fitness</span>
      </a>
      <a class="nav-item" data-route="sleep">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><path d="M21 13a9 9 0 11-10-10 7 7 0 0010 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Sommeil</span>
      </a>
      <a class="nav-item" data-route="learning">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><path d="M3 5l9-2 9 2v12l-9 2-9-2V5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 3v16" stroke="currentColor" stroke-width="2"/></svg>
        <span>Apprentissage</span>
      </a>
      <a class="nav-item" data-route="tasks">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9l2 2 4-4M7 15l2 2 4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Tâches</span>
      </a>
      <a class="nav-item" data-route="stats">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Statistiques</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="nav-item" data-route="settings">
        <svg viewBox="0 0 24 24" width="20" height="20" class="nav-icon"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Paramètres</span>
      </a>
    </div>
  </aside>

  <div class="main-wrapper">

    <header class="topbar">
      <button id="menu-btn" class="icon-btn mobile-only" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <button id="theme-btn" class="icon-btn" aria-label="Theme">
          <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

  </div>

  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div id="modal-root" class="modal-root hidden">
    <div class="modal-backdrop"></div>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Titre</h3>
        <button id="modal-close" class="icon-btn" aria-label="Fermer">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6l-12 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

</div>

<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/router.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/habits.js"></script>
<script src="js/views/goals.js"></script>
<script src="js/views/journal.js"></script>
<script src="js/views/finance.js"></script>
<script src="js/views/fitness.js"></script>
<script src="js/views/sleep.js"></script>
<script src="js/views/learning.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/stats.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
